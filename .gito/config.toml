{{"\n"}}{{ Style.BRIGHT }}{{Back.RED}}[ {{ issue.id}} ]{{Back.RESET}} {{ issue.title -}}{{ Style.RESET_ALL -}}
{{"\n"}}{{ file_link(issue.file) -}}{%- if issue.affected_lines -%}:{{issue.affected_lines[0].start_line}}{%- endif -%}
{%- if issue.affected_lines -%}{% if issue.affected_lines[0].end_line != issue.affected_lines[0].start_line or issue.affected_lines|length > 1 -%} {{ ui.gray }}行{{' '}}{{ Fore.RESET -}}{%- for i in issue.affected_lines -%}{{ i.start_line }}{%- if i.end_line != i.start_line -%}{{ ui.gray }}–{{Fore.RESET}}{{ i.end_line }}{%- endif -%}{%- if loop.last == false -%}{{ ui.gray(', ') }}{%- endif -%}{%- endfor -%}{%- endif -%}{%- endif -%}{{"\n"}}
{% if issue.details -%}{{"\n"}}{{ issue.details.strip() }}{{"\n"}}{%- endif -%}
{%- for tag in issue.tags -%}{{Back.YELLOW}}{{Fore.BLACK}} {{tag}} {{Style.RESET_ALL}}{{ ' ' }}{%- endfor -%}{%- if issue.tags %}{{ "\n" }}{% endif -%}
{%- for i in issue.affected_lines -%}
    {%- if i.affected_code -%}{{"\n"+Fore.RED + " ╭────[ 💥 受影响代码 ]────\n" -}}{{ textwrap.indent(i.affected_code.strip(), Fore.RED+' │  ') }}{{"\n ╰────"+Style.RESET_ALL -}}{%- endif -%}
    {%- if i.proposal -%}
        {%- set maxlen = 100 -%}
        {%- if not i.affected_code %}{{ Fore.GREEN }} ╭───{% endif -%}
        {%- if i.proposal.splitlines() | length == 1 and max_line_len(i.proposal)<80 -%}
            {{- Fore.GREEN + "──[ 💡 建议修改 ]" + "─"*(max_line_len(i.proposal)-25) + "─╮" +"\n" -}}{{- block_wrap_lr(i.proposal, '', ' │', 60, 30) -}}{{"\n ╰──"+"─"*([max_line_len(i.proposal)-5+1,26]|max)+"─╯" -}}
        {%- else -%}
            {{- Fore.GREEN + "──[ 💡 建议修改 ]" + "─"*([max_line_len(i.proposal)-25+2,maxlen-22-2]|min -2) + "─╮" +"\n" -}}{{- i.proposal -}}{{"\n ╰───"+"─"*([[max_line_len(i.proposal)-25+2,maxlen-25+1]|min - 2 + 25 - 5,25-7+2]|max)+"─╯" -}}
        {%- endif -%}
        {{- Style.RESET_ALL -}}
    {%- endif -%}
{%- endfor -%}{{"\n"}}
{%- endfor -%}
{%- if report.processing_warnings -%}{{"\n\n"}}{{ Style.BRIGHT }}⚠️ 处理警告{{ Style.RESET_ALL -}}{%- for warning in report.processing_warnings -%}{{"\n"}}  {{ Fore.YELLOW }}- {{ warning.message }}{{ Style.RESET_ALL -}}{%- endfor -%}
{%- endif -%}
"""

# ── LLM 配置 ──
retries = 3

prompt = """
{{ self_id }}
----任务----
审查提供的代码差异，仅识别高度确信且与上下文相关的问题。

----待审查变更----
{{ input }}
--------

{% if file_lines -%}
----补充上下文: 应用变更后的完整文件内容----
{{ file_lines }}
{%- endif %}

----审查准则----
- 仅报告**100% 确信**在任何上下文中都相关的问题
- 不报告软件版本、模型名称等未发布信息相关的问题
- 仅包含有显著价值的问题（Bug、安全漏洞、可维护性）
- 不报告模糊、理论化或过于泛泛的建议
- 不报告中等及以下置信度的问题
- **拼写错误视为最高严重级别**
{{ requirements -}}
{{ json_requirements }}

以有效 JSON 数组响应，格式如下：
[
    {
        "title": "<问题标题>",
        "details": "<问题描述>",
        "tags": ["<标签1>", "<标签2>", ...],
        "severity": <严重度:int>,
        "confidence": <置信度:int>,
        "affected_lines": [
            {
                "start_line": <int>,
                "end_line": <int>,
                "proposal": "<替换代码（可选）>"
            }
        ]
    }
]

- `proposal` 必须匹配原始代码缩进，可直接替换 start_line..end_line
可用标签: bug, security, performance, readability, maintainability, overcomplexity, language, architecture, compatibility, deprecation, anti-pattern, naming, code-style
严重度: 1-致命 2-严重 3-一般 4-轻微 5-建议
置信度: 1-最高(必报) 2-很高 3-高 4-中等(不报)
若无问题，返回空列表: []
"""

post_process = """
for fn in issues:
    issues[fn] = [i for i in issues[fn] if i["confidence"] == 1 and i["severity"] <= 3]
"""

summary_prompt = """
{{ self_id }}
用一句话总结本次代码审查。
--审查变更--
{% for part in diff %}{{ part }}{{ '\n' }}{% endfor %}
--检测到的问题--
{{ issues | tojson(indent=2) }}
---
{% if awards -%}
若代码包含杰出贡献，可在摘要中颁发奖项。
- 仅授予初始代码作者，非审查者
- 颁奖前单独一行放置 <!-- award --> 注释
--可用奖项--
{{ awards }}
---
{%- endif %}
{% if pipeline_out.associated_issue and pipeline_out.associated_issue.title %}
----子任务----
用一句话说明代码变更如何满足关联需求。
- 相关文本前单独一行放置 <!-- issue_alignment --> 注释
- 用 ✅ 或 ⚠️ 标示是否完全满足
--关联需求--
