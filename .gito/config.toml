{{- HTML_CR_COMMENT_MARKER -}}
"""

report_template_cli = """
{{ Back.BLUE }}  +  +  +  ---==<<[ 代码审查{{Style.NORMAL}} ]>>==---  +  +  +  {{Style.RESET_ALL}}
{% if report.total_issues > 0 -%}
{{ Style.BRIGHT }}{{Back.RED}} ⚠️ {{ report.total_issues }} 个问题 {{Back.RESET}} / {{Back.BLUE}} {{ report.number_of_processed_files }} 个文件 {{Back.RESET}}{{ Style.RESET_ALL }}
{%- else -%}
{{ Style.BRIGHT }}{{Back.GREEN}} ✅ 无问题 {{Back.RESET}} / {{Back.BLUE}} {{ report.number_of_processed_files }} 个文件 {{Back.RESET}}{{ Style.RESET_ALL }}
{%- endif -%}
{%- if report.summary -%}{{"\n\n"}}{{ Style.BRIGHT }}✨ 摘要 {{ Style.RESET_ALL }}{{"\n"}}{{ remove_html_comments(report.summary) }}{%- endif %}
