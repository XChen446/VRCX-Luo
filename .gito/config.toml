{% if report.summary -%}{{ report.summary }}{%- endif %}
{% if report.total_issues > 0 -%}**⚠️ 发现 {{ report.total_issues }} 个问题**，涉及 {{ report.number_of_processed_files }} 个文件
{%- else -%}**✅ 未发现明显问题**，审查了 {{ report.number_of_processed_files }} 个文件
{%- endif -%}

{%- for issue in (report.plain_issues if include_issues | default(true) else unanchored_issues | default([])) -%}
{{"\n"}}## `#{{ issue.id}}` {{ issue.title -}}
{{"\n"}}[{{ issue.file }}{{ ' ' }}
{%- if issue.affected_lines -%}{%- for i in issue.affected_lines -%}L{{ i.start_line }}{%- if i.end_line != i.start_line -%}-L{{ i.end_line }}{%- endif -%}{%- if loop.last == false -%}, {%- endif -%}{%- endfor -%}{%- endif -%}
]({{ issue.code_link(report.target) }})
{{"\n"}}{{ issue.details -}}
{{"\n"}}**标签: {{ ', '.join(issue.tags) }}**
{%- for i in issue.affected_lines -%}
    {%- if i.affected_code %}\n**受影响代码:**\n```{{ i.syntax_hint }}\n{{ i.affected_code }}\n```{%- endif -%}
    {%- if i.proposal %}\n**建议修改:**\n```{{ i.syntax_hint }}\n{{ i.proposal }}\n```{%- endif -%}
{%- endfor -%}{{"\n"}}
{%- endfor -%}
{%- if report.processing_warnings -%}{{"\n\n"}}## 处理警告
{%- for warning in report.processing_warnings -%}{{"\n"}}  - {{ warning.message -}}{%- endfor -%}
