{{ pipeline_out.associated_issue.description }}
URL: {{ pipeline_out.associated_issue.url }}
---
示例：
满足: <!-- issue_alignment -->\n✅ 实现满足 [<需求键>](<URL>)。
存疑: <!-- issue_alignment -->\n⚠️ <具体差距描述>。
{% endif -%}
- 仅输出必要内容，不含额外文本
- 使用 Markdown 格式
{{ summary_requirements -}}
"""

