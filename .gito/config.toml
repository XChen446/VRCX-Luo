{%- for i in issue.affected_lines -%}
    {%- if i.proposal %}\n**建议修改:**\n```{{ i.syntax_hint }}\n{{ i.proposal }}\n```{%- endif -%}
{%- endfor %}
{{- HTML_INLINE_CR_COMMENT_MARKER -}}
"""

report_template_md = """
