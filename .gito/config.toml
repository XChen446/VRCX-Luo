# ── LLM 配置 ──
retries = 3

prompt = """
{{ self_id }}
----任务----
审查提供的代码差异，仅识别高度确信且与上下文相关的问题。

----待审查变更----
{{ input }}
--------

{% if file_lines -%}
----补充上下文: 应用变更后的完整文件内容----
{{ file_lines }}
{%- endif %}

----审查准则----

【置信门槛】
- 仅报告 100% 确信在任何上下文中都相关的问题
- 不报告中等及以下置信度的问题
- 不报告模糊、理论化或过于泛泛的建议

【禁止报告】
- 不报告软件版本、模型名称等未发布信息相关的问题
- 不报告纯风格偏好（如变量命名审美、注释措辞）——除非违反代码库既有约定
- 不报告拼写错误——除非出现在标识符或字符串字面量中且会导致运行时错误

【验证义务——违反则视为误报】
1. 文件归属验证: 报告中标注的文件路径必须确实包含被报告的代码。若代码在文件 A 而报告标注文件 B，该问题将被视为无效。
2. 调用链追踪: 若被审查代码通过间接层（适配器、包装函数、中间件、归一化层等）调用底层 API，必须追踪完整调用链后再判定参数绑定、类型匹配等问题。禁止仅凭调用点与底层 API 的字面差异判定 bug——差异可能由中间层正确处理。
3. 闭包与作用域验证: 对 JavaScript/TypeScript 代码，报告 TDZ/ReferenceError/作用域问题前，必须确认：(a) 变量在引用时（而非定义时）是否已初始化；(b) 函数声明提升 vs const/let 箭头函数的区别；(c) 闭包按引用捕获的语义。
4. 设计意图判定: 若某模式（如 fire-and-forget 异步调用、空 catch 块、未 await 的 Promise）在代码库中重复出现 3 次以上，视为刻意设计而非遗漏，不得报告为 bug。可在 details 中注明"该模式在代码库中重复出现，建议评估是否需要统一错误处理"作为 severity >= 4 的建议。
5. 业务逻辑验证: 报告逻辑错误时，必须在 details 中说明：(a) 代码当前行为是什么；(b) 基于调用上下文推断的预期行为是什么；(c) 二者为何不一致。若无法确定预期行为，不得报告。

【报告标准】
- 仅包含有显著价值的问题: Bug、安全漏洞、数据丢失风险、可维护性退化
- 每个问题的 details 必须包含可验证的证据: 具体行号、代码片段、调用路径
- proposal 必须匹配原始代码缩进，可直接替换 start_line..end_line
{{ requirements -}}
{{ json_requirements }}

以有效 JSON 数组响应，格式如下：
[
    {
        "title": "<问题标题>",
        "details": "<问题描述，含证据>",
        "tags": ["<标签1>", "<标签2>", ...],
        "severity": <严重度:int>,
        "confidence": <置信度:int>,
        "affected_lines": [
            {
                "start_line": <int>,
                "end_line": <int>,
                "proposal": "<替换代码（可选）>"
            }
        ]
    }
]

可用标签: bug, security, performance, readability, maintainability, overcomplexity, language, architecture, compatibility, deprecation, anti-pattern, naming, code-style
严重度: 1-致命 2-严重 3-一般 4-轻微 5-建议
置信度: 1-最高(必报) 2-很高 3-高 4-中等(不报)
若无问题，返回空列表: []
"""

post_process = """
for fn in issues:
    issues[fn] = [i for i in issues[fn] if i["confidence"] == 1 and i["severity"] <= 3]
"""

