name: CI
on:
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_js:
    name: Lint JS (Oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oxc-project/oxlint-action@v2.0.1
        with:
          config: .oxlintrc.json
        continue-on-error: true

  format_js:
    name: Format JS (Oxfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check

  format_c_sharp:
    name: Format C# (dotnet format)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Run Dotnet format
        run: |
          dotnet format whitespace --no-restore --verify-no-changes
          dotnet format style --no-restore --verify-no-changes

  # Phase 9 slice S12 (task 9.15): PostgreSQL 16/17 integration test matrix.
  # Runs `*.pgsql.test.js` against a PG service container. Tests self-skip
  # when PG_TEST_HOST is unset, so this job is the only place they actually
  # execute. See docs/PHASE9_PGSQL_DESIGN.md §7.5 / §10.2 S12 for design.
  test_pgsql:
    name: PgSQL Integration (PG ${{ matrix.pg.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg:
          - { image: postgres:16, version: "16" }
          - { image: postgres:17, version: "17" }
    services:
      postgres:
        image: ${{ matrix.pg.image }}
        env:
          POSTGRES_PASSWORD: vrcx
          POSTGRES_USER: vrcx
          POSTGRES_DB: vrcx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_HOST: localhost
      PG_TEST_PORT: 5432
      PG_TEST_USER: vrcx
      PG_TEST_PASSWORD: vrcx
      PG_TEST_DB: vrcx
      PG_TEST_VERSION: ${{ matrix.pg.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U vrcx; then break; fi
            sleep 2
          done
      - name: Run PgSQL integration tests
        run: npm test -- --run --include '**/*.pgsql.test.js'
